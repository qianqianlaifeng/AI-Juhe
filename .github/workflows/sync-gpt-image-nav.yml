name: Sync GPT Image nav data

on:
  schedule:
    # 每小时同步一次源站数据（UTC 的每小时 23 分）
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gpt-image-nav
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (仅导航页目录)
        uses: actions/checkout@v4
        with:
          sparse-checkout: gpt-image-nav

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync data
        working-directory: gpt-image-nav
        run: node scripts/sync.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git add gpt-image-nav/data gpt-image-nav/index.html
          git commit -m "chore(gpt-image-nav): sync channel data"
          git push
