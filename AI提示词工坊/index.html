<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 提示词工坊 · 实时社区图库</title>
<meta name="description" content="实时浏览社区 AI 图片与视频作品，查看并一键复制对应的生成提示词与参数。">
<style>
  [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2300d4ff'/%3E%3Cpath fill='%23ffffff' d='M19.35 10.04A7.49 7.49 0 0 0 12 4a7.48 7.48 0 0 0-6.39 3.65A5.5 5.5 0 0 0 5.5 18.5h14a4 4 0 0 0 .85-8.46z'/%3E%3C/svg%3E">
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<header class="hd">
  <div class="hd-top">
    <a class="brand" href="../index.html" title="返回聚合平台">
      <span class="brand-mark"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#ffffff" d="M19.35 10.04A7.49 7.49 0 0 0 12 4a7.48 7.48 0 0 0-6.39 3.65A5.5 5.5 0 0 0 5.5 18.5h14a4 4 0 0 0 .85-8.46z"/></svg></span>
      <span class="brand-txt">
        <strong>AI 提示词工坊</strong>
        <em>实时社区图库 · 图片 / 视频 / 提示词</em>
      </span>
    </a>
    <div class="src-note">
      <span class="dot"></span>
      实时数据更新~
    </div>
  </div>

  <div class="hd-ctrl">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 1 1 4 10.5a6.5 6.5 0 0 1 13 0z"/></svg>
      <input id="kw" type="search" placeholder="搜索关键词，例如：赛博朋克 / 汉服 / 产品广告 …" autocomplete="off">
      <button id="kwbtn" type="button">搜索</button>
    </div>

    <div class="seg" id="seg" role="tablist">
      <button class="on" data-mode="image" role="tab">🖼️ 图片</button>
      <button data-mode="video" role="tab">🎬 视频</button>
    </div>
  </div>

  <div class="hd-filter">
    <label class="fl">模型
      <select id="f-model"><option value="">全部模型</option></select>
    </label>
    <label class="fl">来源
      <select id="f-source">
        <option value="">全部来源</option>
        <option value="1">WebUI</option>
        <option value="3">ComfyUI</option>
        <option value="5">图片生成器</option>
        <option value="6">视频生成器</option>
        <option value="0">本地上传</option>
      </select>
    </label>
    <label class="fl">排序
      <select id="f-sort">
        <option value="0">推荐</option>
        <option value="2">最新</option>
        <option value="hot">本页最热</option>
      </select>
    </label>
    <label class="chk">
      <input id="f-prompt" type="checkbox" checked>
      <span>只看带生成参数</span>
    </label>
    <span class="hint" id="hint">提示：保持勾选「只看带生成参数」，列出的作品基本都公开了提示词（视频同样可读）</span>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <div class="bar-info" id="count">正在连接社区…</div>
    <div class="bar-tools">
      <button id="refresh" type="button" class="ghost">↻ 刷新</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="state" id="state" hidden></div>

  <div class="more" id="more" hidden>
    <button id="morebtn" type="button">加载更多</button>
  </div>
</main>

<!-- 详情面板 -->
<div class="modal" id="modal" hidden>
  <div class="modal-mask" data-close></div>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-x" data-close type="button" aria-label="关闭">✕</button>
    <div class="modal-body">
      <div class="mv">
        <div class="mv-stage" id="mv-stage"></div>
        <div class="mv-meta" id="mv-meta"></div>
      </div>
      <div class="mi">
        <div class="mi-head">
          <h3 id="mi-title">—</h3>
          <div class="mi-sub" id="mi-sub"></div>
          <div class="mi-src" id="mi-src"></div>
        </div>
        <div class="mi-params" id="mi-params"></div>

        <section class="pbox">
          <div class="pbox-h">
            <span>正向提示词</span>
            <button class="copy" data-copy="prompt" type="button">复制</button>
          </div>
          <div class="pbox-b" id="p-prompt">—</div>
        </section>

        <section class="pbox" id="neg-wrap">
          <div class="pbox-h">
            <span>负向提示词</span>
            <button class="copy" data-copy="neg" type="button">复制</button>
          </div>
          <div class="pbox-b" id="p-neg">—</div>
        </section>

        <div class="mi-actions">
          <button class="act primary" id="copy-all" type="button">📋 复制全部（含参数）</button>
          <a class="act" id="open-raw" href="#" target="_blank" rel="noopener">⬇ 原图</a>
        </div>

        <div class="mi-load" id="mi-load" hidden>
          <span class="spin"></span> 正在获取提示词…
        </div>
        <div class="mi-err" id="mi-err" hidden></div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js?v=14"></script>
</body>
</html>
